# SafeFlipLab — manual-only offline CI.
#
# WHY manual only:
#   Automatic push/PR triggers would consume Actions minutes on every push;
#   enabling them requires explicit owner approval. The manual-only policy is
#   kept deliberately so no run happens by accident. Run this workflow from
#   the Actions tab (or `gh workflow run`) when you want a green check.
#
# WHAT it does: installs the `test` extra (no simulator extras needed for unit
# tests) and runs the two offline unit suites + the publication verifier.
#   * NO simulator episodes are launched (FakeAdapter / synthetic data only).
#   * NO secrets are used; the token is read-only.
name: offline-unit-tests

on:
  workflow_dispatch: {}   # manual trigger only — see header note

permissions:
  contents: read

concurrency:
  group: offline-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: offline unit tests (py${{ matrix.python-version }}) — no simulator episodes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout (read-only token)
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Print environment
        run: |
          python --version
          python -m pip --version
          uname -a

      - name: Install test extra (offline unit tests only, no simulator episodes)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Static offline guard — tests must not launch real episodes
        # Executable guard (scripts/ci_offline_guard.py): exits non-zero if any
        # test/example could launch a billed episode via a subprocess, a CLI
        # entrypoint list, a real-adapter construction, or a real simulator
        # import. Proven by tests/test_ci_offline_guard.py (positive + negative).
        # The suites are FakeAdapter-only by design; the in-process formal GO
        # gate is the second, independent defence. Manual-only trigger + a
        # read-only token + no secrets remain the outermost guarantees.
        run: python scripts/ci_offline_guard.py

      - name: V01 unit tests (expected Ran 234, OK (skipped=1))
        run: python -m unittest discover -s tests -q

      - name: V02 unit tests (expected Ran 143, OK)
        working-directory: v02
        run: python -m unittest discover -s tests -q

      - name: Publication manifest check (v1.0 byte-exact + v1.1 scope)
        run: python scripts/verify_publication.py

      - name: Offline synthetic demo (no simulator)
        run: python examples/offline_demo.py
